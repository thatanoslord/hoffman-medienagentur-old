<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Flipper / Card Reveal</title>
<style>
  :root{
    --transition-duration: 0.8s;
    --transition-ease: cubic-bezier(0.44, 0, 0.56, 1);
    --card-bg: #111111;
    --card-bg-active: #000000;
    --text-color: #ffffff;
    --text-muted: rgba(255,255,255,0.65);
    --accent: #ffffff;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
  }

  .page{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  /* ---------------- Feature Flipper Component ---------------- */
  .flipper{
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 1080px;
    height: 420px;
    position: relative;
  }

  .flip-card{
    position: relative;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card-bg);
    flex: 1 1 50%;
    min-width: 0;
    transition: flex-basis var(--transition-duration) var(--transition-ease),
                flex-grow var(--transition-duration) var(--transition-ease);
  }

  /* Default neutral: ~49.6% / 50.4% split (matches original ratios) */
  .flip-card[data-card="1"]{ flex-basis: 49.59%; }
  .flip-card[data-card="2"]{ flex-basis: 50.41%; }

  /* When card 1 is active: 75% / 25% */
  .flipper.active-1 .flip-card[data-card="1"]{ flex-basis: 75%; }
  .flipper.active-1 .flip-card[data-card="2"]{ flex-basis: 25%; }

  /* When card 2 is active: 25% / 75% */
  .flipper.active-2 .flip-card[data-card="1"]{ flex-basis: 25%; }
  .flipper.active-2 .flip-card[data-card="2"]{ flex-basis: 75%; }

  .flip-card-inner{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px;
    color: var(--text-color);
  }

  .flip-card-bg{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.35;
    transition: opacity var(--transition-duration) var(--transition-ease);
  }

  .flip-card.expanded .flip-card-bg{ opacity: 0.55; }

  .flip-card::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  .flip-card-icon{
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    backdrop-filter: blur(6px);
  }

  .flip-card-icon svg{ width: 24px; height: 24px; }

  .flip-card-tag{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    position: relative;
    z-index: 2;
    white-space: nowrap;
  }

  .flip-card-title{
    font-size: clamp(18px, 2.2vw, 26px);
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 8px 0;
    position: relative;
    z-index: 2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .flip-card-desc{
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 0;
    position: relative;
    z-index: 2;
    max-width: 420px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s ease, max-height 0.6s ease;
    transition-delay: 0s;
  }

  .flip-card.expanded .flip-card-desc{
    opacity: 1;
    max-height: 100px;
    transition-delay: 0.25s;
  }

  /* Shrink title/tag text a bit gracefully when card is small */
  .flip-card:not(.expanded) .flip-card-title{
    font-size: clamp(14px, 1.4vw, 18px);
  }

  /* ---------------- Mobile: stack vertically ---------------- */
  @media (max-width: 809px){
    .flipper{
      flex-direction: column;
      height: 634px;
      max-width: 360px;
      width: 100%;
    }

    .flip-card[data-card="1"]{ flex-basis: 50%; }
    .flip-card[data-card="2"]{ flex-basis: calc(50% - 10px); }

    .flipper.active-1 .flip-card[data-card="1"]{ flex-basis: 69.87%; }
    .flipper.active-1 .flip-card[data-card="2"]{ flex-basis: calc(30.13% - 10px); }

    .flipper.active-2 .flip-card[data-card="1"]{ flex-basis: calc(30% - 10px); }
    .flipper.active-2 .flip-card[data-card="2"]{ flex-basis: 70%; }

    .flip-card:not(.expanded) .flip-card-desc{
      display: none;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="flipper active-1" id="flipper">

    <div class="flip-card expanded" data-card="1" id="card1">
      <div class="flip-card-bg" style="background-image:url('https://framerusercontent.com/images/d1Tgw9tBpOs9466ASU4fWd6j1w.png?width=1200&height=1200');"></div>
      <div class="flip-card-inner">
        <div class="flip-card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.5"/>
            <path d="M8 12h8M12 8v8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="flip-card-tag">AI Agent</div>
        <h3 class="flip-card-title">Ship Products Faster Than Ever</h3>
        <p class="flip-card-desc">Build, test, and launch in weeks, not months.</p>
      </div>
    </div>

    <div class="flip-card" data-card="2" id="card2">
      <div class="flip-card-bg" style="background-image:url('https://framerusercontent.com/images/xWq5qlnMo4nwNQlhbzFUKWqikwQ.jpg?width=1280&height=853');"></div>
      <div class="flip-card-inner">
        <div class="flip-card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4v5h5M20 20v-5h-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.5 15a8 8 0 0014.9 2.5M19.5 9A8 8 0 004.6 6.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="flip-card-tag">Automation</div>
        <h3 class="flip-card-title">Scale Without Breaking Things</h3>
        <p class="flip-card-desc">Grow confidently with infrastructure that adapts automatically.</p>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const flipper = document.getElementById('flipper');
  const card1 = document.getElementById('card1');
  const card2 = document.getElementById('card2');

  function activate(cardNumber){
    flipper.classList.remove('active-1', 'active-2');
    flipper.classList.add('active-' + cardNumber);

    card1.classList.toggle('expanded', cardNumber === 1);
    card2.classList.toggle('expanded', cardNumber === 2);
  }

  card1.addEventListener('click', function(){ activate(1); });
  card2.addEventListener('click', function(){ activate(2); });

  // start with card 1 expanded (matches "Card 1 active" default demo state)
  activate(1);
})();
</script>

</body>
</html>
