<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid Text Warp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #efefef;
      --hint: #8d8d8d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body { min-height: 100vh; }

    .hero {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4vw;
      position: relative;
      overflow: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .type-stage {
      position: relative;
      width: min(96vw, 1600px);
      aspect-ratio: 1920 / 760;
      cursor: default;
    }

    .type-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-family: "Archivo Black", Inter, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.94;
      letter-spacing: -0.01em;
      text-align: center;
      font-size: 82px;
      color: #fff;
      user-select: none;
      z-index: 1;
      transition: opacity .3s ease;
    }

    .fluid-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      z-index: 2;
      transition: opacity .35s ease;
      pointer-events: auto;
    }

    .type-stage[data-ready="true"][data-active="true"] .fluid-canvas,
    .type-stage[data-ready="true"]:hover .fluid-canvas {
      opacity: 1;
    }

    .type-stage[data-ready="true"][data-active="true"] .type-fallback,
    .type-stage[data-ready="true"]:hover .type-fallback {
      opacity: 0;
    }

    .hint {
      margin-top: 28px;
      font-size: 13px;
      color: var(--hint);
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 900px) {
      .type-stage {
        width: min(95vw, 1200px);
        aspect-ratio: 1100 / 620;
      }

      .type-fallback {
        font-size: clamp(34px, 11vw, 110px);
        line-height: 0.98;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fluid-canvas,
      .type-fallback {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1 class="sr-only">Fluid Colors, Fluid Swirl</h1>

    <div class="type-stage" id="typeStage" data-ready="false" data-active="false">
      <div class="type-fallback" aria-hidden="true">
        <span>FLUID COLORS</span>
        <span>FLUID SWIRL</span>
      </div>
      <canvas class="fluid-canvas" id="fluidCanvas" aria-hidden="true"></canvas>
    </div>

    <p class="hint">Move your cursor across the text — click for a burst.</p>
  </section>

  <script>
    (() => {
      "use strict";

      const TRAIL_LENGTH = 14;
      const NOISE_SIZE = 256;
      const LINES = ["FLUID COLORS", "FLUID SWIRL"];
      const FONT_FAMILY = '"Archivo Black", Inter, sans-serif';

      const CONFIG = {
        effect: {
          gradientEnabled: true,
          colors: ["#fff", "#fff", "#fff", "#fff"],
          radius: 0.30,
          strength: 1.15,
          distortion: 0.95,
          hueShift: 1,
          colorCycleSpeed: 0.15
        },
        animation: {
          speed: 0.42,
          trailPersistence: 0.972,
          pointerSmoothing: 0.07
        },
        advanced: {
          quality: "high",
          fadeInDuration: 0.35,
          maxDpr: 2
        }
      };

      const stage = document.getElementById("typeStage");
      const canvas = document.getElementById("fluidCanvas");

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function parseColorToRgb01(input) {
        const hex = input.trim().replace("#", "");
        const normalized =
          hex.length === 3
            ? hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]
            : hex.length === 6
            ? hex
            : hex.slice(0, 6).padEnd(6, "0");
        const int = Number.parseInt(normalized, 16);
        return [((int >> 16) & 255) / 255, ((int >> 8) & 255) / 255, (int & 255) / 255];
      }

      function generateNoiseTexture() {
        const data = new Uint8Array(NOISE_SIZE * NOISE_SIZE * 4);
        let seed = 48271;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let y = 0; y < NOISE_SIZE; y++) {
          for (let x = 0; x < NOISE_SIZE; x++) {
            const idx = (y * NOISE_SIZE + x) * 4;
            const angle = rand() * Math.PI * 2;
            data[idx] = Math.floor((Math.cos(angle) * 0.5 + 0.5) * 255);
            data[idx + 1] = Math.floor((Math.sin(angle) * 0.5 + 0.5) * 255);
            data[idx + 2] = Math.floor(rand() * 255);
            data[idx + 3] = 255;
          }
        }
        return data;
      }

      const NOISE_DATA = generateNoiseTexture();

      const VERTEX_SHADER = `
        attribute vec2 aPosition;
        varying vec2 vUv;
        void main() {
          vUv = aPosition * 0.5 + 0.5;
          gl_Position = vec4(aPosition, 0.0, 1.0);
        }
      `;

      function buildFragmentShader(quality) {
        const useHighQuality = quality === "high";
        return `
          precision highp float;

          varying vec2 vUv;

          uniform vec2 uResolution;
          uniform vec2 uPointer;
          uniform float uPointerActive;
          uniform float uTime;
          uniform sampler2D uNoiseTex;
          uniform sampler2D uTextTex;
          uniform vec2 uTextTexSize;
          uniform vec3 uBaseColor;
          uniform vec3 uEffectColor1;
          uniform vec3 uEffectColor2;
          uniform vec3 uEffectColor3;
          uniform vec3 uEffectColor4;
          uniform float uGradientEnabled;
          uniform float uRadius;
          uniform float uStrength;
          uniform float uSpeed;
          uniform float uDistortion;
          uniform float uHueShift;
          uniform float uColorCycle;
          uniform vec2 uTrail[${TRAIL_LENGTH}];
          uniform vec2 uTrailVelocities[${TRAIL_LENGTH}];
          uniform float uTrailStrengths[${TRAIL_LENGTH}];
          uniform float uBurst;
          uniform vec2 uBurstPos;

          vec2 noiseTexCoord(vec2 i) {
            return (floor(mod(i, 256.0)) + 0.5) / 256.0;
          }

          float gnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
            vec2 g00 = texture2D(uNoiseTex, noiseTexCoord(i)).rg * 2.0 - 1.0;
            vec2 g10 = texture2D(uNoiseTex, noiseTexCoord(i + vec2(1.0, 0.0))).rg * 2.0 - 1.0;
            vec2 g01 = texture2D(uNoiseTex, noiseTexCoord(i + vec2(0.0, 1.0))).rg * 2.0 - 1.0;
            vec2 g11 = texture2D(uNoiseTex, noiseTexCoord(i + vec2(1.0, 1.0))).rg * 2.0 - 1.0;
            return mix(
              mix(dot(g00, f - vec2(0.0, 0.0)), dot(g10, f - vec2(1.0, 0.0)), u.x),
              mix(dot(g01, f - vec2(0.0, 1.0)), dot(g11, f - vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          mat2 rot(float a) {
            float c = cos(a);
            float s = sin(a);
            return mat2(c, -s, s, c);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 r = rot(0.37);
            for (int i = 0; i < 4; i++) {
              v += a * gnoise(p);
              p = r * p * 2.0 + vec2(13.7, 31.5);
              a *= 0.5;
            }
            return v;
          }

          vec2 flowField(vec2 p) {
            ${useHighQuality ? `
              float eps = 0.1;
              float n1 = gnoise(p + vec2(0.0, eps));
              float n2 = gnoise(p - vec2(0.0, eps));
              float n3 = gnoise(p + vec2(eps, 0.0));
              float n4 = gnoise(p - vec2(eps, 0.0));
              float dFdy = (n1 - n2) / (2.0 * eps);
              float dFdx = (n3 - n4) / (2.0 * eps);
              return vec2(dFdy, -dFdx);
            ` : `
              float n = gnoise(p);
              float n2 = gnoise(p + vec2(3.7, 9.2));
              return normalize(vec2(n, n2) + 0.0001);
            `}
          }

          vec3 rgb2hsl(vec3 c) {
            float mx = max(max(c.r, c.g), c.b);
            float mn = min(min(c.r, c.g), c.b);
            float l = (mx + mn) * 0.5;
            if (mx == mn) return vec3(0.0, 0.0, l);
            float d = mx - mn;
            float s = l > 0.5 ? d / (2.0 - mx - mn) : d / (mx + mn);
            float h;
            if (mx == c.r) h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
            else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
            else h = (c.r - c.g) / d + 4.0;
            h /= 6.0;
            return vec3(h, s, l);
          }

          float hue2rgb(float p, float q, float t) {
            if (t < 0.0) t += 1.0;
            if (t > 1.0) t -= 1.0;
            if (t < 1.0 / 6.0) return p + (q - p) * 6.0 * t;
            if (t < 1.0 / 2.0) return q;
            if (t < 2.0 / 3.0) return p + (q - p) * (2.0 / 3.0 - t) * 6.0;
            return p;
          }

          vec3 hsl2rgb(vec3 hsl) {
            if (hsl.y == 0.0) return vec3(hsl.z);
            float q = hsl.z < 0.5 ? hsl.z * (1.0 + hsl.y) : hsl.z + hsl.y - hsl.z * hsl.y;
            float p = 2.0 * hsl.z - q;
            return vec3(
              hue2rgb(p, q, hsl.x + 1.0 / 3.0),
              hue2rgb(p, q, hsl.x),
              hue2rgb(p, q, hsl.x - 1.0 / 3.0)
            );
          }

          float textAlpha(vec2 uv) {
            return texture2D(uTextTex, uv).a;
          }

          void main() {
            vec2 uv = vUv;
            float aspectRatio = uResolution.x / max(uResolution.y, 1.0);
            vec2 aspect = vec2(aspectRatio, 1.0);
            vec2 p = uv * aspect;
            float time = uTime * uSpeed;
            float radiusScaled = uRadius * max(aspectRatio, 1.0);

            vec2 baseFlow = flowField(p * 2.35 + time * 0.35);

            float hoverDist = distance(p, uPointer * aspect);
            float hoverT = 1.0 - smoothstep(0.0, radiusScaled, hoverDist);
            float hoverInfluence = hoverT * hoverT * hoverT * uPointerActive * uStrength;

            vec2 totalSwirl = vec2(0.0);
            float trailInfluence = 0.0;

            for (int i = 0; i < ${TRAIL_LENGTH}; i++) {
              float trailStr = uTrailStrengths[i];
              if (trailStr < 0.001) continue;
              vec2 trailPos = uTrail[i] * aspect;
              vec2 toTrail = p - trailPos;
              float dist = length(toTrail);
              float t = 1.0 - smoothstep(0.0, radiusScaled, dist);
              float influence = t * t * t * trailStr;
              vec2 tangent = vec2(-toTrail.y, toTrail.x);
              vec2 vel = uTrailVelocities[i];
              float velMag = length(vel);
              if (dist > 0.0001) {
                totalSwirl += normalize(tangent) * influence * (0.09 + velMag * 2.9) * uDistortion;
              }
              totalSwirl += vel * influence * 0.24 * uDistortion;
              totalSwirl += baseFlow * influence * 0.18 * uDistortion;
              trailInfluence += influence;
            }

            trailInfluence = clamp(trailInfluence, 0.0, 1.0);

            vec2 burstSwirl = vec2(0.0);
            float burstInfluence = 0.0;
            if (uBurst > 0.001) {
              float burstDist = distance(p, uBurstPos * aspect);
              float burstExpand = 1.0 + (1.0 - uBurst) * 2.2;
              float burstRadius = radiusScaled * burstExpand;
              float burstT = 1.0 - smoothstep(0.0, burstRadius, burstDist);
              burstInfluence = burstT * burstT * uBurst * uStrength;
              vec2 burstDir = p - uBurstPos * aspect;
              float bdLen = length(burstDir);
              if (bdLen > 0.0001) {
                burstDir /= bdLen;
                burstSwirl = burstDir * burstInfluence * uDistortion * 1.1;
              }
            }

            vec2 displacement = totalSwirl * 0.55 + burstSwirl * 0.7 + baseFlow * hoverInfluence * 0.03;
            vec2 warpedUv = uv + displacement;

            float alpha = textAlpha(warpedUv);
            float edge1 = textAlpha(warpedUv + vec2(0.0025, 0.0));
            float edge2 = textAlpha(warpedUv + vec2(-0.0025, 0.0));
            float edge3 = textAlpha(warpedUv + vec2(0.0, 0.0025));
            float edge4 = textAlpha(warpedUv + vec2(0.0, -0.0025));
            float edgeBoost = clamp((abs(edge1 - edge2) + abs(edge3 - edge4)) * 3.0, 0.0, 1.0);

            vec3 c1 = uEffectColor1;
            vec3 c2 = uEffectColor2;
            vec3 c3 = uEffectColor3;
            vec3 c4 = uEffectColor4;

            vec3 h1 = rgb2hsl(c1);
            vec3 h2 = rgb2hsl(c2);
            vec3 h3 = rgb2hsl(c3);
            vec3 h4 = rgb2hsl(c4);

            h1.x = fract(h1.x + uHueShift + uTime * uColorCycle);
            h2.x = fract(h2.x + uHueShift + uTime * uColorCycle + 0.16);
            h3.x = fract(h3.x + uHueShift + uTime * uColorCycle + 0.33);
            h4.x = fract(h4.x + uHueShift + uTime * uColorCycle + 0.51);

            c1 = hsl2rgb(h1);
            c2 = hsl2rgb(h2);
            c3 = hsl2rgb(h3);
            c4 = hsl2rgb(h4);

            float gA = fbm(warpedUv * 3.0 + vec2(uTime * 0.18, -uTime * 0.13));
            float gB = fbm(warpedUv * 4.6 + vec2(-uTime * 0.12, uTime * 0.09));
            float gC = fbm(warpedUv * 2.2 + baseFlow * 0.8 + uTime * 0.07);

            float mA = clamp(gA * 0.5 + 0.5, 0.0, 1.0);
            float mB = clamp(gB * 0.5 + 0.5, 0.0, 1.0);
            float mC = clamp(gC * 0.5 + 0.5, 0.0, 1.0);

            vec3 grad1 = mix(c1, c2, mA);
            vec3 grad2 = mix(c3, c4, mB);
            vec3 gradientColor = mix(grad1, grad2, mC);

            float activeMix = clamp(hoverInfluence + trailInfluence + burstInfluence, 0.0, 1.0);
            float reveal = smoothstep(0.01, 0.38, activeMix + hoverT * 0.3);

            vec3 finalColor = mix(
              uBaseColor,
              mix(uBaseColor, gradientColor, uGradientEnabled),
              reveal
            );

            finalColor += vec3(1.0) * edgeBoost * 0.08 * reveal;

            gl_FragColor = vec4(finalColor, alpha);
          }
        `;
      }

      function compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const info = gl.getShaderInfoLog(shader) || "Shader compile error";
          gl.deleteShader(shader);
          throw new Error(info);
        }
        return shader;
      }

      function createProgram(gl, fragmentSource) {
        const vertex = compileShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER);
        const fragment = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
        const program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.deleteShader(vertex);
        gl.deleteShader(fragment);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          const info = gl.getProgramInfoLog(program) || "Program link error";
          gl.deleteProgram(program);
          throw new Error(info);
        }
        return program;
      }

      function fitFontSize() {
  return 82;
}

      function buildTextTextureCanvas(width, height) {
        const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.advanced.maxDpr);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(width * dpr));
        c.height = Math.max(1, Math.round(height * dpr));

        const ctx = c.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const paddingX = width * 0.015;
        const fontSize = fitFontSize(ctx, LINES, width - paddingX * 2);
        ctx.font = `700 ${fontSize}px ${FONT_FAMILY}`;
        ctx.fillStyle = "rgba(255,255,255,1)";
        ctx.textBaseline = "alphabetic";

        const lineHeight = fontSize * 0.94;
        const capHeightRatio = 0.72;
        const totalHeight = lineHeight * LINES.length;
        let y = (height - totalHeight) / 2 + fontSize * capHeightRatio;

        LINES.forEach((line) => {
          const w = ctx.measureText(line).width;
          const x = (width - w) / 2;
          ctx.fillText(line, x, y);
          y += lineHeight;
        });

        return c;
      }

      class FluidTextWarp {
        constructor(canvas, host, settings) {
          this.canvas = canvas;
          this.host = host;
          this.settings = settings;
          this.destroyed = false;
          this.rafRunning = false;
          this.reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

          this.gl = canvas.getContext("webgl", {
            alpha: true,
            premultipliedAlpha: false,
            antialias: true,
            preserveDrawingBuffer: false
          });

          if (!this.gl) throw new Error("WebGL not available");

          this.initGL();
          this.bindEvents();
          this.start();
        }

        initGL() {
          const gl = this.gl;
          const fragmentSource = buildFragmentShader(this.settings.advanced.quality);
          this.program = createProgram(gl, fragmentSource);
          gl.useProgram(this.program);

          const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
          this.buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
          gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

          const posLoc = gl.getAttribLocation(this.program, "aPosition");
          gl.enableVertexAttribArray(posLoc);
          gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

          this.loc = {
            uResolution: gl.getUniformLocation(this.program, "uResolution"),
            uPointer: gl.getUniformLocation(this.program, "uPointer"),
            uPointerActive: gl.getUniformLocation(this.program, "uPointerActive"),
            uTime: gl.getUniformLocation(this.program, "uTime"),
            uNoiseTex: gl.getUniformLocation(this.program, "uNoiseTex"),
            uTextTex: gl.getUniformLocation(this.program, "uTextTex"),
            uTextTexSize: gl.getUniformLocation(this.program, "uTextTexSize"),
            uBaseColor: gl.getUniformLocation(this.program, "uBaseColor"),
            uEffectColor1: gl.getUniformLocation(this.program, "uEffectColor1"),
            uEffectColor2: gl.getUniformLocation(this.program, "uEffectColor2"),
            uEffectColor3: gl.getUniformLocation(this.program, "uEffectColor3"),
            uEffectColor4: gl.getUniformLocation(this.program, "uEffectColor4"),
            uGradientEnabled: gl.getUniformLocation(this.program, "uGradientEnabled"),
            uRadius: gl.getUniformLocation(this.program, "uRadius"),
            uStrength: gl.getUniformLocation(this.program, "uStrength"),
            uSpeed: gl.getUniformLocation(this.program, "uSpeed"),
            uDistortion: gl.getUniformLocation(this.program, "uDistortion"),
            uHueShift: gl.getUniformLocation(this.program, "uHueShift"),
            uColorCycle: gl.getUniformLocation(this.program, "uColorCycle"),
            uTrail: gl.getUniformLocation(this.program, "uTrail"),
            uTrailVelocities: gl.getUniformLocation(this.program, "uTrailVelocities"),
            uTrailStrengths: gl.getUniformLocation(this.program, "uTrailStrengths"),
            uBurst: gl.getUniformLocation(this.program, "uBurst"),
            uBurstPos: gl.getUniformLocation(this.program, "uBurstPos")
          };

          this.noiseTex = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.noiseTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, NOISE_SIZE, NOISE_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, NOISE_DATA);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

          this.textTex = gl.createTexture();
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, this.textTex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

          this.refreshSettings();
        }

        refreshSettings() {
          this.baseColorRgb = parseColorToRgb01("#fff");
          this.effectColorRgb = this.settings.effect.colors.map(parseColorToRgb01);
        }

        updateTextTexture() {
          const gl = this.gl;
          const w = Math.max(2, this.host.clientWidth);
          const h = Math.max(2, this.host.clientHeight);
          const textCanvas = buildTextTextureCanvas(w, h);
          this.textTexWidth = textCanvas.width;
          this.textTexHeight = textCanvas.height;
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, this.textTex);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
        }

        bindEvents() {
          const host = this.host;
          this.cw = Math.max(1, host.clientWidth || 1);
          this.ch = Math.max(1, host.clientHeight || 1);

          this.ro = new ResizeObserver((entries) => {
            for (const entry of entries) {
              const cr = entry.contentRect;
              this.cw = Math.max(1, Math.floor(cr.width));
              this.ch = Math.max(1, Math.floor(cr.height));
              this.resizeCanvas();
              this.updateTextTexture();
              this.ensureRAF();
            }
          });
          this.ro.observe(host);

          this.targetPointer = { x: 0.5, y: 0.5 };
          this.smoothPointer = { x: 0.5, y: 0.5 };
          this.prevSmooth = { x: 0.5, y: 0.5 };
          this.pointerVelocity = { x: 0, y: 0 };
          this.pointerInside = false;
          this.pointerActiveFade = 0;
          this.burstValue = 0;
          this.burstPos = { x: 0.5, y: 0.5 };

          this.trail = Array.from({ length: TRAIL_LENGTH }, () => ({
            x: -1,
            y: -1,
            vx: 0,
            vy: 0,
            strength: 0
          }));

          this.trailFlat = new Float32Array(TRAIL_LENGTH * 2);
          this.trailVelFlat = new Float32Array(TRAIL_LENGTH * 2);
          this.trailStrengths = new Float32Array(TRAIL_LENGTH);

          const toLocal = (clientX, clientY) => {
            const rect = host.getBoundingClientRect();
            return {
              x: clamp((clientX - rect.left) / rect.width, 0, 1),
              y: clamp(1 - (clientY - rect.top) / rect.height, 0, 1),
              valid: rect.width > 0 && rect.height > 0
            };
          };

          this.onPointerMove = (e) => {
            if (this.reducedMotion) return;
            const pt = toLocal(e.clientX, e.clientY);
            if (!pt.valid) return;
            this.targetPointer = { x: pt.x, y: pt.y };
            this.pointerInside = true;
            this.host.setAttribute("data-active", "true");
            this.ensureRAF();
          };

          this.onPointerLeave = () => {
            this.pointerInside = false;
            this.ensureRAF();
          };

          this.onPointerDown = (e) => {
            if (this.reducedMotion) return;
            const pt = toLocal(e.clientX, e.clientY);
            if (!pt.valid) return;
            this.burstPos = { x: pt.x, y: pt.y };
            this.burstValue = 1;
            this.host.setAttribute("data-active", "true");
            this.ensureRAF();
          };

          host.addEventListener("pointermove", this.onPointerMove);
          host.addEventListener("pointerleave", this.onPointerLeave);
          host.addEventListener("pointerdown", this.onPointerDown);
        }

        resizeCanvas() {
          const gl = this.gl;
          const dpr = Math.min(window.devicePixelRatio || 1, this.settings.advanced.maxDpr);
          const pw = Math.max(1, Math.floor(this.cw * dpr));
          const ph = Math.max(1, Math.floor(this.ch * dpr));
          if (pw !== this.lastPw || ph !== this.lastPh) {
            this.canvas.width = pw;
            this.canvas.height = ph;
            gl.viewport(0, 0, pw, ph);
            this.lastPw = pw;
            this.lastPh = ph;
          }
        }

        start() {
          this.resizeCanvas();
          this.updateTextTexture();
          this.startTime = performance.now();
          this.lastFrameTime = performance.now();
          this.render = this.render.bind(this);
          this.ensureRAF();
        }

        ensureRAF() {
          if (!this.rafRunning && !this.destroyed) {
            this.rafRunning = true;
            this.raf = requestAnimationFrame(this.render);
          }
        }

        render(now) {
          if (this.destroyed) {
            this.rafRunning = false;
            return;
          }

          const gl = this.gl;
          const dt = Math.min((now - this.lastFrameTime) / 1000, 0.1);
          this.lastFrameTime = now;
          const dtScale = dt * 60;

          const smoothK = 1 - Math.pow(
            1 - clamp(this.settings.animation.pointerSmoothing, 0.01, 1),
            dtScale
          );

          this.prevSmooth.x = this.smoothPointer.x;
          this.prevSmooth.y = this.smoothPointer.y;
          this.smoothPointer.x += (this.targetPointer.x - this.smoothPointer.x) * smoothK;
          this.smoothPointer.y += (this.targetPointer.y - this.smoothPointer.y) * smoothK;

          const rawVx = dt > 0 ? (this.smoothPointer.x - this.prevSmooth.x) / dt : 0;
          const rawVy = dt > 0 ? (this.smoothPointer.y - this.prevSmooth.y) / dt : 0;

          const velDecay = Math.pow(0.5, dtScale);
          this.pointerVelocity.x = this.pointerVelocity.x * velDecay + rawVx * (1 - velDecay);
          this.pointerVelocity.y = this.pointerVelocity.y * velDecay + rawVy * (1 - velDecay);

          const fadeTarget = this.pointerInside ? 1 : 0;
          const fadeK = 1 - Math.pow(1 - 0.1, dtScale);
          this.pointerActiveFade += (fadeTarget - this.pointerActiveFade) * fadeK;

          if (this.burstValue > 0.001) {
            this.burstValue *= Math.pow(0.94, dtScale);
            if (this.burstValue < 0.001) this.burstValue = 0;
          }

          const trailDecay = Math.pow(this.settings.animation.trailPersistence, dtScale);
          for (let i = 0; i < TRAIL_LENGTH; i++) {
            this.trail[i].strength *= trailDecay;
          }

          const dx = this.smoothPointer.x - this.trail[0].x;
          const dy = this.smoothPointer.y - this.trail[0].y;

          if (this.pointerInside && dx * dx + dy * dy > 0.00005) {
            for (let i = TRAIL_LENGTH - 1; i > 0; i--) {
              this.trail[i].x = this.trail[i - 1].x;
              this.trail[i].y = this.trail[i - 1].y;
              this.trail[i].vx = this.trail[i - 1].vx;
              this.trail[i].vy = this.trail[i - 1].vy;
              this.trail[i].strength = this.trail[i - 1].strength;
            }
            this.trail[0].x = this.smoothPointer.x;
            this.trail[0].y = this.smoothPointer.y;
            this.trail[0].vx = this.pointerVelocity.x * dt;
            this.trail[0].vy = this.pointerVelocity.y * dt;
            this.trail[0].strength = 1;
          } else if (this.pointerInside) {
            this.trail[0].x = this.smoothPointer.x;
            this.trail[0].y = this.smoothPointer.y;
            this.trail[0].vx = this.pointerVelocity.x * dt;
            this.trail[0].vy = this.pointerVelocity.y * dt;
            this.trail[0].strength = 1;
          }

          for (let i = 0; i < TRAIL_LENGTH; i++) {
            this.trailFlat[i * 2] = this.trail[i].x;
            this.trailFlat[i * 2 + 1] = this.trail[i].y;
            this.trailVelFlat[i * 2] = this.trail[i].vx;
            this.trailVelFlat[i * 2 + 1] = this.trail[i].vy;
            this.trailStrengths[i] = this.trail[i].strength;
          }

          gl.useProgram(this.program);
          gl.uniform2f(this.loc.uResolution, this.lastPw || 1, this.lastPh || 1);
          gl.uniform2f(this.loc.uPointer, this.smoothPointer.x, this.smoothPointer.y);
          gl.uniform1f(this.loc.uPointerActive, this.pointerActiveFade);
          gl.uniform1f(this.loc.uTime, (now - this.startTime) * 0.001);
          gl.uniform1i(this.loc.uNoiseTex, 0);
          gl.uniform1i(this.loc.uTextTex, 1);
          gl.uniform2f(this.loc.uTextTexSize, this.textTexWidth || 1, this.textTexHeight || 1);

          gl.uniform3f(this.loc.uBaseColor, this.baseColorRgb[0], this.baseColorRgb[1], this.baseColorRgb[2]);
          gl.uniform3f(this.loc.uEffectColor1, this.effectColorRgb[0][0], this.effectColorRgb[0][1], this.effectColorRgb[0][2]);
          gl.uniform3f(this.loc.uEffectColor2, this.effectColorRgb[1][0], this.effectColorRgb[1][1], this.effectColorRgb[1][2]);
          gl.uniform3f(this.loc.uEffectColor3, this.effectColorRgb[2][0], this.effectColorRgb[2][1], this.effectColorRgb[2][2]);
          gl.uniform3f(this.loc.uEffectColor4, this.effectColorRgb[3][0], this.effectColorRgb[3][1], this.effectColorRgb[3][2]);

          gl.uniform1f(this.loc.uGradientEnabled, this.settings.effect.gradientEnabled ? 1 : 0);
          gl.uniform1f(this.loc.uRadius, this.settings.effect.radius);
          gl.uniform1f(this.loc.uStrength, this.settings.effect.strength);
          gl.uniform1f(this.loc.uSpeed, this.settings.animation.speed);
          gl.uniform1f(this.loc.uDistortion, this.settings.effect.distortion);
          gl.uniform1f(this.loc.uHueShift, this.settings.effect.hueShift);
          gl.uniform1f(this.loc.uColorCycle, this.settings.effect.colorCycleSpeed);
          gl.uniform2fv(this.loc.uTrail, this.trailFlat);
          gl.uniform2fv(this.loc.uTrailVelocities, this.trailVelFlat);
          gl.uniform1fv(this.loc.uTrailStrengths, this.trailStrengths);
          gl.uniform1f(this.loc.uBurst, this.burstValue);
          gl.uniform2f(this.loc.uBurstPos, this.burstPos.x, this.burstPos.y);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          let settled = this.pointerActiveFade < 0.001 && this.burstValue < 0.001;
          if (settled) {
            for (let i = 0; i < TRAIL_LENGTH; i++) {
              if (this.trailStrengths[i] > 0.001) {
                settled = false;
                break;
              }
            }
          }

          if (!this.pointerInside && settled) {
            this.host.setAttribute("data-active", "false");
            this.rafRunning = false;
            return;
          }

          this.raf = requestAnimationFrame(this.render);
        }
      }

      function init() {
        try {
          const fluid = new FluidTextWarp(canvas, stage, CONFIG);
          stage.setAttribute("data-ready", "true");
          window.fluidTextWarp = { instance: fluid, config: CONFIG };
        } catch (err) {
          console.warn("Fluid text warp unavailable:", err);
          canvas.style.display = "none";
        }
      }

      const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reducedMotion) {
        const fontsReady = document.fonts && document.fonts.ready
          ? document.fonts.load(`400 200px ${FONT_FAMILY}`).then(() => document.fonts.ready)
          : Promise.resolve();
        fontsReady.then(init).catch(init);
      }
    })();
  </script>
</body>
</html>
