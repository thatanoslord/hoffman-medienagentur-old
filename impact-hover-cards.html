<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Workflow Cards</title>

  <style>
    :root {
      --page-bg: #ffffff;
      --card-bg: #f5f5f0;
      --text: #111111;
      --muted: #72726c;
      --radius: 28px;
      --transition: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: var(--page-bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .workflow-section {
      width: min(1220px, 100%);
    }

    .workflow-cards {
      display: flex;
      gap: 10px;
      width: 100%;
      min-height: 455px;
    }

    .workflow-card {
      position: relative;
      isolation: isolate;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      border: 0;
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      padding: 0;
      transition:
        flex 700ms var(--transition),
        background-color 350ms ease;
      outline: none;
    }

    .workflow-card.is-active {
      flex: 2.15;
    }

    .workflow-card:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

    .card-number {
      position: absolute;
      top: 30px;
      left: 28px;
      z-index: 3;
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .card-image {
      position: absolute;
      inset: 11px 11px 11px auto;
      width: 0;
      border-radius: 18px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(22px);
      transition:
        width 700ms var(--transition),
        opacity 350ms ease,
        transform 700ms var(--transition);
      pointer-events: none;
    }

    .workflow-card.is-active .card-image {
      width: 48%;
      opacity: 1;
      transform: translateX(0);
    }

    .card-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.04) 0%,
        rgba(0, 0, 0, 0) 35%,
        rgba(0, 0, 0, 0.12) 100%
      );
      pointer-events: none;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform: scale(1.05);
      transition: transform 900ms var(--transition);
    }

    .workflow-card.is-active .card-image img {
      transform: scale(1);
    }

    .card-content {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 30px;
      z-index: 2;
      max-width: 290px;
      transition:
        max-width 700ms var(--transition),
        opacity 300ms ease;
    }

    .workflow-card.is-active .card-content {
      max-width: 43%;
    }

    .card-title {
      margin: 0;
      font-size: clamp(25px, 2vw, 34px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    .card-description {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .card-extra {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      overflow: hidden;
      transition:
        grid-template-rows 450ms var(--transition),
        opacity 250ms ease,
        margin-top 450ms var(--transition);
    }

    .card-extra-inner {
      min-height: 0;
    }

    .card-extra p {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .workflow-card.is-active .card-extra {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 18px;
      transition-delay: 130ms;
    }

    .card-arrow {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 3;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(17, 17, 17, 0.12);
      border-radius: 999px;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 250ms ease,
        transform 350ms var(--transition),
        background-color 250ms ease,
        color 250ms ease;
    }

    .workflow-card.is-active .card-arrow {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 180ms;
    }

    .workflow-card:hover .card-arrow {
      background: #111;
      color: #fff;
    }

    .card-arrow svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 850px) {
      body {
        display: block;
        padding: 20px;
      }

      .workflow-cards {
        flex-direction: column;
        min-height: auto;
      }

      .workflow-card,
      .workflow-card.is-active {
        flex: none;
        height: 175px;
        transition: height 600ms var(--transition);
      }

      .workflow-card.is-active {
        height: 430px;
      }

      .card-image {
        top: 10px;
        right: 10px;
        bottom: 10px;
        width: 0;
        transform: translateY(18px);
      }

      .workflow-card.is-active .card-image {
        width: 47%;
        transform: translateY(0);
      }

      .card-content,
      .workflow-card.is-active .card-content {
        max-width: 48%;
      }

      .card-title {
        font-size: 27px;
      }
    }

    @media (max-width: 560px) {
      .workflow-card.is-active {
        height: 520px;
      }

      .workflow-card.is-active .card-image {
        top: 100px;
        right: 10px;
        bottom: auto;
        width: calc(100% - 20px);
        height: 215px;
      }

      .card-content,
      .workflow-card.is-active .card-content {
        left: 22px;
        right: 22px;
        bottom: 24px;
        max-width: none;
      }

      .card-number {
        top: 24px;
        left: 22px;
      }

      .card-arrow {
        right: 20px;
        bottom: 22px;
      }
    }
  </style>

  <style>
    .workflow-cards {
  display: flex;
  gap: 8px;
  width: 100%;
  min-height: 455px;
}

.workflow-card.is-active {

.workflow-card.is-active .card-image {

</head>

<body>
  <section class="workflow-section">
    <div class="workflow-cards" id="workflowCards">

      <button class="workflow-card is-active" type="button" data-card="1" aria-expanded="true">

            Paste your URL and let our clinical engine run a comprehensive 360° technical scan instantly.

          <div class="card-extra">
            <div class="card-extra-inner">
              <p>Every fault is ranked by the traffic actually at risk, so the first fix is the one that pays.</p>
              <p>Approved changes can be deployed through your CMS and tracked against the pages they affect.</p>
            </div>
          </div>
        </div>

        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </span>
      </button>

      <button class="workflow-card" type="button" data-card="2" aria-expanded="false">
        <span class="card-number">02</span>

        <div class="card-image">
          <img
            src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=900&q=90"
            alt="Website analytics dashboard"
          />
        </div>

        <div class="card-content">
          <h3 class="card-title">Get your audit report</h3>

          <p class="card-description">
            Access a high-fidelity breakdown of exactly what’s working, what’s broken, and what to fix first.
          </p>

          <div class="card-extra">
            <div class="card-extra-inner">
              <p>Review technical SEO, performance, indexation, content opportunities, and conversion issues in one report.</p>
              <p>Turn your findings into a prioritized action plan for your team or client.</p>
            </div>
          </div>
        </div>

        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </span>
      </button>

      <button class="workflow-card" type="button" data-card="3" aria-expanded="false">
        <span class="card-number">03</span>

        <div class="card-image">
          <img
            src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=900&q=90"
            alt="Team working on growth strategy"
          />
        </div>

        <div class="card-content">
          <h3 class="card-title">Optimize &amp; Scale</h3>

          <p class="card-description">
            Use AI-driven tips to improve rankings and convert traffic into revenue automatically.
          </p>

          <div class="card-extra">
            <div class="card-extra-inner">
              <p>Apply guided recommendations, monitor impact, and keep improving the pages that matter most.</p>
              <p>Move from isolated fixes to a repeatable SEO growth system.</p>
            </div>
          </div>
        </div>

        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </span>
      </button>

      <!-- Card 04 -->
<button class="workflow-card" type="button" data-card="4" aria-expanded="false">
  <span class="card-number">04</span>

  <div class="card-image">
    <img
      src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=900&q=90"
      alt="Team planning an SEO strategy"
    />
  </div>

  <div class="card-content">
    <h3 class="card-title">Build your strategy</h3>

    <p class="card-description">
      Turn audit insights into a clear, practical roadmap for sustainable search growth.
    </p>

    <div class="card-extra">
      <div class="card-extra-inner">
        <p>Set priorities for technical SEO, content, authority, and conversion improvements.</p>
        <p>Give every recommendation an owner, a deadline, and a measurable outcome.</p>
      </div>
    </div>
  </div>

  <span class="card-arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 12h14"></path>
      <path d="m13 6 6 6-6 6"></path>
    </svg>
  </span>
</button>

<!-- Card 05 -->
<button class="workflow-card" type="button" data-card="5" aria-expanded="false">
  <span class="card-number">05</span>

  <div class="card-image">
    <img
      src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=900&q=90"

  <div class="card-content">
    <h3 class="card-title">Track performance</h3>

    <p class="card-description">
      Monitor rankings, organic visibility, technical health, and revenue impact in one place.
    </p>

    <div class="card-extra">
      <div class="card-extra-inner">
        <p>Follow the pages, queries, and campaigns that create meaningful business results.</p>
        <p>Use clear reporting to understand what improved and where to focus next.</p>
      </div>
    </div>
  </div>

  <span class="card-arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 12h14"></path>
      <path d="m13 6 6 6-6 6"></path>
    </svg>
  </span>
</button>

<!-- Card 06 -->
<button class="workflow-card" type="button" data-card="6" aria-expanded="false">
  <span class="card-number">06</span>

  <div class="card-image">
    <img
      src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=90"
      alt="Team celebrating business growth"
    />
  </div>

  <div class="card-content">
    <h3 class="card-title">Scale with confidence</h3>

    <p class="card-description">
      Repeat the workflow, automate routine checks, and grow without losing control of quality.
    </p>

    <div class="card-extra">
      <div class="card-extra-inner">
        <p>Keep your SEO system running with continuous monitoring and AI-assisted recommendations.</p>
        <p>Make every new page, market, and campaign stronger from the start.</p>
      </div>
    </div>
  </div>

  <span class="card-arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 12h14"></path>
      <path d="m13 6 6 6-6 6"></path>
    </svg>
  </span>
</button>

    </div>
  </section>

  <script>
    const cards = document.querySelectorAll(".workflow-card");

    function activateCard(selectedCard) {
      cards.forEach((card) => {
        const isActive = card === selectedCard;

        card.classList.toggle("is-active", isActive);
        card.setAttribute("aria-expanded", isActive ? "true" : "false");
      });
    }

    cards.forEach((card) => {
      card.addEventListener("mouseenter", () => activateCard(card));
      card.addEventListener("focus", () => activateCard(card));
      card.addEventListener("click", () => activateCard(card));
    });
  </script>
</body>
</html>
